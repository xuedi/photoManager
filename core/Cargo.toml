[package]
name = "photomanager-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The library behind photoManager: scanning, metadata, identity, thumbnails, places and the write engine."

[dependencies]
fast_image_resize = "6.1"
rayon = "1.12.0"
rexiv2 = "0.10.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
tracing.workspace = true
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config"] }
unicode-normalization = "0.1.25"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
walkdir = "2.5.0"
webp = { version = "0.3", default-features = false }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zune-jpeg = "0.5.15"

[features]
fixtures = []

[dev-dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
