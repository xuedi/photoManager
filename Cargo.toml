[workspace]
members = ["core", "app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "EUPL-1.2"
repository = "https://github.com/xuedi/photoManager"

[workspace.dependencies]
photomanager-core = { path = "core" }
tracing = "0.1"

# The debug build is the one that is run day to day; SQLite unoptimised makes every query crawl.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
# glycin turns a photo by its orientation in this process; unoptimised that takes a second.
[profile.dev.package.glycin-utils]
opt-level = 3
